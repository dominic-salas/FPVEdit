name: Release

# Builds the Windows installer on GitHub's runner (nothing is installed on a developer's
# PC): the standalone app with a shared FFmpeg build, packed by Inno Setup.
# A tag such as v1.0.0 also makes a *draft* GitHub release with the installer attached;
# publishing it stays a manual step. Run it by hand (Actions > Release > Run workflow)
# to get the installer as a workflow artifact only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # only used to create the draft release on a tag

env:
  # BtbN's GPL shared build of the FFmpeg 9.0 branch (~87 MB zip, sources: ffmpeg.org).
  FFMPEG_ZIP: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --group build --extra app

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(uv run python -c "import fpv_editor; print(fpv_editor.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }

      - name: Download FFmpeg
        shell: bash
        run: |
          curl -L --fail -o ffmpeg.zip "$FFMPEG_ZIP"
          7z x -offmpeg ffmpeg.zip > /dev/null
          echo "FFMPEG_BIN=$(cygpath -w "$(ls -d "$PWD"/ffmpeg/*/bin)")" >> "$GITHUB_ENV"

      - name: Build the standalone app
        run: uv run python scripts/build_windows.py --ffmpeg "${{ env.FFMPEG_BIN }}"

      - name: Smoke test the build
        shell: bash
        run: |
          "dist/FPV Editor/fpv-editor.exe" --version
          "dist/FPV Editor/ffmpeg/ffmpeg.exe" -hide_banner -version | head -1

      - name: Build the installer
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"  # keep /DAppVersion=... as an option, not a path
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -x "$iscc" || choco install innosetup -y --no-progress
          version=$(uv run python -c "import fpv_editor; print(fpv_editor.__version__)")
          "$iscc" "/DAppVersion=$version" packaging/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FPV-Editor-installer
          path: dist/FPV-Editor-*-setup.exe
          retention-days: 14

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/FPV-Editor-*-setup.exe --draft --generate-notes
