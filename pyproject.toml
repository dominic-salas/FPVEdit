[project]
name = "fpvedit"
version = "1.0.1"
description = "Offline montage editor for FPV freestyle recordings: finds flips, spins and close passes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dominic Salas" }]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
# Runtime dependencies, each with the reason it is needed.
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<6",  # 5.x verified; re-check before a major upgrade
]

[project.urls]
Homepage = "https://github.com/dominic-salas/FPVEdit"
Download = "https://github.com/dominic-salas/FPVEdit/releases/latest"
Issues = "https://github.com/dominic-salas/FPVEdit/issues"
Changelog = "https://github.com/dominic-salas/FPVEdit/blob/main/CHANGELOG.md"
Funding = "https://ko-fi.com/dvsalas"

[project.optional-dependencies]
# The desktop app (fpvedit-app). Qt for Python, LGPL-3.0, used as an unmodified library.
app = ["PySide6-Essentials>=6.10"]
# The image model (SigLIP 2, Apache-2.0) that compares the scenery of shots. PyTorch
# (BSD-3) runs it on an NVIDIA GPU or the CPU; transformers (Apache-2.0) loads it;
# Pillow (MIT-CMU) feeds it frames. Weights are downloaded on first use, never shipped.
ml = ["torch>=2.9", "transformers>=4.56", "pillow>=11"]

[project.scripts]
fpvedit = "fpvedit.cli:main"

[project.gui-scripts]
fpvedit-app = "fpvedit.app:main"

[dependency-groups]
build = [
    "pyinstaller>=6.16",  # the standalone Windows app (scripts/build_windows.py)
]
dev = [
    "PySide6-Essentials>=6.10",  # app tests and type checks
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

# CUDA builds of PyTorch on Windows and Linux (the default index has CPU-only Windows wheels).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpvedit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PTH", "RUF"]
ignore = [
    "S603", # subprocess calls are reviewed; argument lists only, never shell=True
    "S607", # ffmpeg/ffprobe/git are resolved from PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true  # the optional ml extra

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not model"]
markers = [
    "integration: runs real ffmpeg/ffprobe on generated fixtures (no downloads, no GPU)",
    "model: runs real model inference; downloads weights; opt-in with -m model",
]
